[package]
name = "rain-client"
version = "0.1.0"
edition = "2021"
description = "RAIN Mobile and Desktop Client"

[lib]
name = "rain_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rain-protocol = { path = "../../../crates/rain-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }

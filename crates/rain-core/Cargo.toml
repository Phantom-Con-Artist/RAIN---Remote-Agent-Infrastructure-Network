[package]
name = "rain-core"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Core orchestration, capability registry, and agent supervisor for RAIN"

[dependencies]
rain-protocol = { path = "../rain-protocol" }
rain-platform = { path = "../rain-platform" }
tokio = { version = "1.0", features = ["full"] }
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
thiserror = "2.0"
anyhow = "1.0"
chrono = "0.4"
uuid = { version = "1.0", features = ["serde", "v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
libc = "0.2"
sysinfo = "0.38"

base64 = "0.23.1"

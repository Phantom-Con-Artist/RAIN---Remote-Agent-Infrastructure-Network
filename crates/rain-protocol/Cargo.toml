[package]
name = "rain-protocol"
version = "0.1.0"
edition = "2021"
description = "Shared requests, responses, and event types for RAIN"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
